[package]
name = "kubegenx-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow-array = "55"
arrow-schema = "55"
parquet = "55"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tonic = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
tonic-build = "0.12"
